name: Daily News Digest

on:
  schedule:
    # 매일 07:30 KST (= 22:30 UTC 전날). GitHub cron은 수 분~수십 분 지연될 수 있음
    - cron: "30 22 * * *"
  workflow_dispatch:      # Actions 탭에서 수동 실행 가능
    inputs:
      openrouter_models:
        description: "(시험용) OpenRouter 모델을 쉼표로 지정. 비워 두면 기본값"
        required: false
        default: ""
      dry_run:
        description: "(시험용) 체크하면 이슈/메일을 만들지 않고 결과를 실행 로그에만 출력"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write   # GitHub 알림 방식: 뉴스를 이슈로 올려 메일 알림을 받음

concurrency:
  group: daily-news          # 같은 시각에 두 번 실행돼 이슈가 중복 생성되는 것을 막음
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install Claude SDK (Claude API 키를 쓸 때만)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: pip install anthropic
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Send digest
        env:
          # --- 요약 엔진 (키가 여럿이면 claude → gemini → openrouter 순으로 시도, 모두 없으면 헤드라인만 발송: 비용 0원) ---
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: ${{ inputs.openrouter_models || vars.OPENROUTER_MODELS }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          # --- GitHub 알림 (키 입력 불필요: GitHub가 자동 제공하는 토큰 사용) ---
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NOTIFY: ${{ vars.ISSUE_NOTIFY }}
          ISSUE_ASSIGNEES: ${{ vars.ISSUE_ASSIGNEES }}
          # --- 이메일 ---
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          # --- 텔레그램 ---
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_digest.py ${{ inputs.dry_run && '--dry-run' || '' }}
